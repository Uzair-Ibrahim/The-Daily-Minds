services:
  - type: web
    name: the-daily-mind
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/Uzair-Ibrahim/The-Daily-Minds
    branch: main
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: DATABASE_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: daily_mind
      - key: SUPABASE_AUTH_ENABLED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: STORY_SEMANTIC_ENABLED
        value: "false"
      - key: CREDIT_SEARCH_CONFIRMED_FREE
        value: "false"
      - key: LLM_PROVIDER
        value: none
      - key: DAILY_GENERATION_ENABLED
        value: "true"
